name: fetch-quotes

on:
  schedule:
    - cron: "0 8 * * 1-5"    # after Asia/Europe morning
    - cron: "30 22 * * 1-5"  # after US close
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python ingest/fetch_quotes.py
      - name: Commit new snapshot
        run: |
          git config user.name "market-map-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
